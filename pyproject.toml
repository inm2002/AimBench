[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimbench"
version = "1.0.0"
description = "Aimlabs visual algorithm comparison with shared capture and control"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.2.6",
    "opencv-python==4.10.0.84",
    "dxcam==0.3.0; sys_platform == 'win32'",
    "pywin32==312; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["ruff==0.16.5"]

[project.scripts]
aimbench = "aimbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aimbench = ["assets/*.png", "assets/*.npz", "assets/*.json", "assets/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".local", "runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
